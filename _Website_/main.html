<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riptide</title>

    <link rel="stylesheet" href="Static/main.css">
    <script src="Static/main.js" defer></script>

    <!-- Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="preload"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        as="style"
        onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
    </noscript>
</head>

<!-- All js ID's are in camelCase, while all css/html classes
 are in kebab-case-->
<body> <!-- Body start -->

    <nav class="header-bar">  <!-- Can also be used as a navigation bar later -->
        <p class ="header-text">Riptide</p>
    </nav>

    <div class="info-popup-box" id="infoPopupBox" style="display: none;">
        <div class="info-popup-close" id="infoPopupClose">&times;</div>
        <div class="info-popup-text" id="infoPopupText">
            <p>"This project called ‘Riptide’ is an AI natural language music recommendation system that utilizes artificial intelligence with a clustering backend to create a hybrid system that uses minimal user data and maximizes musical diversity."</p>
        </div>
    </div>


    <div class="grid-container">

        <div class="nav-box">
            <div class="nav-grid">
                <div class="user-icon" id="userIcon"></div> 
                <div class="user-name" id="userName"></div>
                
                <div class="playlists-button nav-button" id="playlistsButton"> 
                    <button id="playlistsButton" style="display: none;"></button>
                    <div class="button-text"> Playlists </div>  
                </div>
                <div class="chat-button nav-button" id="chatButton"> 
                    <button id="chatButton" style="display: none;"></button>
                    <div class="button-text"> Chats </div>  
                </div>
                <div class="info-button nav-button" id="infoButton"> 
                    <button id="infoButton" style="display: none;"></button>
                    <div class="button-text"> Info </div> 
                </div>

                <div class="login-button nav-button"  id="loginButton"> 
                    <button id="loginButton" style="display: none;"></button>
                    <div class="button-text"> Login </div> 
                </div>
            </div>
        </div>

        <div class="playlist-wrapper">
            <div class="playlist-box">
                <div class="playlist-grid" id="playlistGrid">
                    <!-- JS PLAYLIST BOXES GENERATE HERE--></div>
            </div>
        </div>

        <div class="chatbox">
            <div class="chatbox-window" id="chatboxWindow">
                </div>

            <div class="chatbox-input-box" id="chatboxInputBox">
                <textarea name="chatbox" class="chatbox-input" id="chatboxInput" placeholder="Write your message here..."></textarea>
                <div class="chatbot-input-button" id="chatbotInputButton">
                <!--Send button image is placed here-->
                    </div>
            </div>
        </div>

    </div> <!-- End for the grid container-->

</body><!-- Body END -->
</html>
